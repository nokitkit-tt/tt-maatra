<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nat Habit Maatra</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBF7F0;--ink:#2B2620;--mute:#6B6257;--line:#E6DDCF;--green:#2E5E4E;--green2:#DCEBE3;--terra:#B5651D;--terra2:#F6E7D6;--card:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1916;--ink:#EEE7DC;--mute:#B3A898;--line:#3A342C;--green:#7FBFA5;--green2:#23352E;--terra:#E39B5A;--terra2:#3A2A1C;--card:#24211D}}
:root[data-theme="dark"]{--bg:#1B1916;--ink:#EEE7DC;--mute:#B3A898;--line:#3A342C;--green:#7FBFA5;--green2:#23352E;--terra:#E39B5A;--terra2:#3A2A1C;--card:#24211D}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Inter',system-ui,sans-serif}
a{color:var(--green);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:'Fraunces',Georgia,serif;font-weight:600;line-height:1.2;margin:0 0 .5em}
.hero{background:linear-gradient(135deg,var(--green2),var(--terra2));padding:64px 0 40px;border-bottom:1px solid var(--line)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;color:var(--terra);font-weight:600;margin:0 0 10px}
.hero h1{font-size:clamp(40px,7vw,68px);color:var(--green);margin-bottom:12px}
.lede{font-size:clamp(17px,2.2vw,21px);max-width:760px;margin:0 0 28px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.kpi b{display:block;font-family:'Fraunces',serif;font-size:30px;color:var(--terra)}.kpi span{font-size:13px;color:var(--mute)}
.toc{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.toc .wrap{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;scrollbar-width:none}
.toc a{white-space:nowrap;text-decoration:none;color:var(--mute);font-size:14px;padding:6px 12px;border-radius:999px}
.toc a:hover{background:var(--green2);color:var(--green)}
section{padding:48px 0 16px;border-bottom:1px solid var(--line);scroll-margin-top:56px}
h2{font-size:clamp(26px,3.4vw,36px);display:flex;align-items:baseline;gap:14px}
h2 span{font-size:15px;color:var(--terra);font-family:'Inter',sans-serif;font-weight:700;letter-spacing:.08em}
h3{font-size:21px;margin-top:28px}h4{font-size:18px;color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:28px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:18px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.card.accent{border-color:var(--green);box-shadow:inset 4px 0 0 var(--green)}
.card.win{border-color:var(--terra);box-shadow:inset 4px 0 0 var(--terra)}.card.soft{background:var(--terra2)}
.card p{margin:.3em 0}.tag{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--terra);font-weight:700}
.risk{font-size:14px;color:var(--mute)}
.brief{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px}.brief p{margin:.4em 0}
table{width:100%;border-collapse:collapse;font-size:14.5px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{background:var(--green);color:#fff;text-align:left;padding:9px 10px;font-weight:600;font-size:13.5px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) th{color:#11201A}}
td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}td.r,th.r{text-align:right;white-space:nowrap}
tr.hl td{background:var(--terra2)}
.scroll{overflow-x:auto;margin:12px 0}.scroll table.matrix,.scroll table.regime,.scroll table.brands{min-width:760px}
.matrix td{text-align:center;color:var(--green);font-size:16px}.matrix td:first-child{text-align:left;color:var(--ink);font-size:14.5px}
.regime td.core{background:var(--green2);text-align:center;font-weight:500}
.brands td:first-child{white-space:nowrap}
.note{font-size:13px;color:var(--mute)}
.ticks{padding-left:0;list-style:none}.ticks li{padding-left:22px;position:relative;margin:.5em 0}
.ticks li:before{content:"";position:absolute;left:4px;top:.65em;width:8px;height:8px;border-radius:50%;background:var(--terra)}
blockquote{margin:0 0 12px;padding:10px 14px;background:var(--card);border-left:3px solid var(--terra);border-radius:0 10px 10px 0;font-size:15px}
blockquote a{font-size:12px;display:block;margin-top:4px}
.callout{background:var(--green2);padding:14px 18px;border-radius:12px}
.bars{display:grid;gap:8px;margin:14px 0}.bar{display:grid;grid-template-columns:240px 1fr 90px;align-items:center;gap:10px;font-size:14px}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--green),var(--terra));width:var(--w);min-width:6px}
.bar b{font-variant-numeric:tabular-nums;text-align:right}.bars.small .bar{grid-template-columns:170px 1fr 70px}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:12px 0}
.journey div{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--green);border-radius:10px;padding:12px;font-size:13.5px;display:flex;flex-direction:column;gap:6px}
.journey b{color:var(--green)}.journey em{color:var(--terra);font-style:normal;font-weight:600;margin-top:auto}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap}.pill.n{background:var(--green2);color:var(--green)}.pill.d{background:var(--terra2);color:var(--terra)}
.sweetspot{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:12px;align-items:center;margin:22px 0}
.sweetspot>div:not(.plus){background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;height:100%}
.sweetspot .win{background:var(--green);border-color:var(--green)}.sweetspot .win h4,.sweetspot .win p{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sweetspot .win h4,:root:not([data-theme="light"]) .sweetspot .win p{color:#11201A}}
.plus{font-size:30px;color:var(--terra);font-family:'Fraunces',serif}
.brand{border-bottom:1px dashed var(--line);padding:8px 0}.brand h4{margin:0}.brand small{font-family:'Inter';font-size:13px;color:var(--mute);font-weight:400}.brand p{margin:.3em 0;font-size:14.5px}
.lessons{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 18px}.lessons div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:14.5px}.lessons b{color:var(--green)}
.phases{display:grid;gap:10px}.phases div{border-left:3px solid var(--terra);padding:4px 0 4px 14px}.phases p{margin:.2em 0;font-size:14.5px}
details summary{cursor:pointer;font-weight:600;color:var(--green);padding:8px 0}
.srccols{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.srccols a{display:block;font-size:13.5px;margin:4px 0}
.foot{padding:30px 0 50px;color:var(--mute);font-size:13px;text-align:center}
#gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--green2),var(--terra2));padding:16px}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px;max-width:380px;width:100%;text-align:center}
#gate h1{color:var(--green);font-size:34px}#gate p{color:var(--mute);font-size:14px}
#gate input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:var(--bg);color:var(--ink);margin:10px 0}
#gate button{width:100%;padding:12px;border:0;border-radius:10px;background:var(--green);color:#fff;font-size:16px;font-weight:600;cursor:pointer}
#err{color:#B3261E;min-height:20px;font-size:14px}
@media (max-width:900px){.kpis,.grid3,.lessons,.srccols{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.journey{grid-template-columns:repeat(3,1fr)}.sweetspot{grid-template-columns:1fr}.plus{text-align:center}}
@media (max-width:560px){.kpis,.grid3,.lessons,.srccols{grid-template-columns:1fr}.journey{grid-template-columns:1fr 1fr}.bar,.bars.small .bar{grid-template-columns:1fr 70px}.bar label{grid-column:1/-1}.bar i{grid-column:1}}
@media print{.toc,#gate{display:none}}
</style></head>

<input id="pw" type="password" placeholder="Password" autocomplete="current-password" autofocus><div id="err"></div><button type="submit">Open report</button></form></div>
<div id="app"></div>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(P.s),iterations:250000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.i)},key,b64(P.d));
  return new TextDecoder().decode(pt);
}
async function go(pw,remember){
  try{const html=await unlock(pw);document.getElementById('gate').remove();document.getElementById('app').innerHTML=html;
    if(remember){try{sessionStorage.setItem('mk',pw)}catch(e){}}
    if(location.hash){const t=document.querySelector(location.hash);if(t)t.scrollIntoView();}
    return true;}catch(e){return false}
}
document.getElementById('gf').addEventListener('submit',async e=>{e.preventDefault();const pw=document.getElementById('pw').value;
  document.getElementById('err').textContent='Unlocking…';if(!(await go(pw,true)))document.getElementById('err').textContent='Incorrect password.';});
(async()=>{let s=null;try{s=sessionStorage.getItem('mk')}catch(e){}if(s)await go(s,false);})();
</script>
